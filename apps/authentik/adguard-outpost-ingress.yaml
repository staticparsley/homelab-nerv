apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-authentik-outpost
  namespace: authentik
spec:
  ingressClassName: nginx
  rules:
    - host: adguard.nerv.local
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: ImplementationSpecific
            backend:
              service:
                name: authentik-server
                port:
                  number: 80