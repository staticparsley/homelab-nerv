apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nerv-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: NERV Root CA
  secretName: nerv-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
