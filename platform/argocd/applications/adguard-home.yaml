apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://repo.helmforge.dev
    chart: adguard-home
    targetRevision: 1.4.12
    helm:
      releaseName: adguard-home
      values: |
        service:
          web:
            type: ClusterIP
            port: 80
          dns:
            type: LoadBalancer
            port: 53
            loadBalancerIP: "192.168.1.241"

        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: selfsigned
            nginx.ingress.kubernetes.io/auth-url: >-
              http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/nginx
            nginx.ingress.kubernetes.io/auth-signin: >-
              https://adguard.nerv.local/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri
            nginx.ingress.kubernetes.io/auth-response-headers: >-
              Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid
            nginx.ingress.kubernetes.io/auth-snippet: |
              proxy_set_header X-Forwarded-Host $http_host;
          hosts:
            - host: adguard.nerv.local
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - adguard.nerv.local
              secretName: adguard-home-tls

        persistence:
          conf:
            enabled: true
            size: 256Mi
          work:
            enabled: true
            size: 2Gi
   

  destination:
    server: https://kubernetes.default.svc
    namespace: adguard-home

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true