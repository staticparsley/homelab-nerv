apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/staticparsley/homelab-nerv.git
    targetRevision: main
    path: apps/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true