apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: 17.1.3
      helm:
        valueFiles:
          - $values/apps/forgejo/values.yaml

    - repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/staticparsley/homelab-nerv.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
